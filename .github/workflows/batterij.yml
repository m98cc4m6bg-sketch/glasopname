# Batterij: draait elke nacht alle testreeksen op wat nu op main staat
# (= wat live staat). Te lang voor elke pull request (±30–60 min); 's nachts
# vangt hij wat de snelle kern mist. Mislukt hij, dan stuurt GitHub een mail.
# Een rode reeks krijgt één herkansing ("goed (haperde)", geen mail); zie
# test/draai.sh en BEHEER.md §12.
# Uitleg voor Jan: BEHEER.md §12.
#
# Let op: GitHub zet geplande workflows in een openbare repo uit na 60 dagen
# zonder activiteit in de repo. Dan staat er een melding op het tabblad
# Actions met een knop om hem weer aan te zetten.

name: Batterij (nachtelijk)

on:
  schedule:
    - cron: '23 2 * * *'   # elke nacht 02:23 UTC (03:23 of 04:23 Nederlandse tijd)
  workflow_dispatch:       # knop "Run workflow" om met de hand te draaien

permissions:
  contents: read

concurrency:
  group: batterij
  cancel-in-progress: false

jobs:
  batterij:
    name: Batterij
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Code ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Bun (voor test-mailfunctie.ts)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Testbibliotheken en Chromium klaarzetten
        # Zelfde opzet als in tests.yml (vaste paden van de cloudomgeving).
        run: |
          sudo mkdir -p /home/claude /opt/pw-browsers
          sudo chown "$USER" /home/claude /opt/pw-browsers
          cd /home/claude
          npm init -y > /dev/null
          npm install --no-audit --no-fund jsdom@30.1.3 jspdf@2.5.2 jspdf-autotable@3.8.4 playwright@1.63.0
          PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers npx playwright install --with-deps chromium
          ln -sf "$(ls -d /opt/pw-browsers/chromium-*/chrome-linux64/chrome | head -n 1)" /opt/pw-browsers/chromium
          pip install pdfplumber==0.11.10 openpyxl==3.1.5   # openpyxl: maatstaten in test-v124-tekeningen/-cycli

      - name: Batterij draaien
        env:
          LOGMAP: ${{ runner.temp }}/testlog
        run: test/draai.sh batterij

      - name: Uitvoer per reeks bewaren (7 dagen)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testuitvoer
          path: ${{ runner.temp }}/testlog
          retention-days: 7
          if-no-files-found: ignore

      - name: Meetlat (ter info)
        if: always()
        run: ./meet.sh >> "$GITHUB_STEP_SUMMARY" || true
